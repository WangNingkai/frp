# Frp Workflow Release Version Bump

## Action

Follow the release-version-bump workflow:
1. Update version in version.go (or pkg/util/version/version.go)
2. Update README.md and/or README_zh.md
3. Update Release.md
4. Update or touch Makefile, go.mod, go.sum as needed
5. Update configuration files (conf/frpc_full.ini, conf/frps_full.ini, etc.)
6. Update or touch test files and assets as needed
7. Update or touch web UI assets (assets/frpc/static/*, assets/frps/static/*, web/frpc/*, web/frps/*)
8. Update or touch server/client/service files

## Evidence

- Workflow detected from commit patterns
- Frequency: ~1x per month
- Files: pkg/util/version/version.go, README.md, README_zh.md

